<div
  id="cart-item-{{ product.id }}"
  class="group bg-white border border-neutral rounded-2xl overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300"
>
  <div class="relative overflow-hidden">
    <img
      src="{{ product.image_url }}"
      class="w-full h-44 md:h-56 object-cover group-hover:scale-105 transition duration-500"
    />

    <!-- CTA Overlay -->
    <div
      class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition duration-300 flex items-center justify-center"
    >
      <a
        href="{% url 'product_details' product.slug %}"
        class="bg-white text-primary px-4 py-2 rounded-xl font-medium shadow-lg hover:scale-105 transition"
      >
        View Product
      </a>
    </div>
  </div>

  <div class="p-3 md:p-4">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h3
          class="text-sm md:text-base font-semibold text-neutral-800 group-hover:text-primary transition"
        >
          {{ product.name }}
        </h3>

        <p class="text-accent font-bold mt-2 text-sm md:text-base">
          ${{ product.price }}
        </p>
      </div>

      {% include 'store/partials/add_to_cart_button.html' %}
    </div>
  </div>
</div>
