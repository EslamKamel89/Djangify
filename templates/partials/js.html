  defer
  src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.2/dist/cdn.min.js"
></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
{% csrf_token %}
<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  const csrftoken = getCookie("csrftoken");
  const api = axios.create({
    headers: {
      Accept: "application/json",
      "Content-Type": "application/json",
    },
    withCredentials: true,
  });
  api.defaults.headers.common["X-CSRFToken"] = csrftoken;
  function pr(value, title) {
    console.log(`<<<${title ?? ""}>>>`, value, "");
    return value;
  }
</script>
<script>
  function updateCartScrollRestore() {
    return {
      restoreScroll() {
        this.$nextTick(() => {
          const itemId = sessionStorage.getItem("last_cart_item");
          if (!itemId) return;
          const element = document.getElementById(`cart-item-${itemId}`);
          if (!element) return;
          element.scrollIntoView({
            behavior: "smooth",
            block: "center",
          });
          element.classList.add("shadow-2xl", "bg-primary/5", "scale-[1.05]");
          setTimeout(() => {
            element.classList.remove(
              "shadow-2xl",
              "bg-primary/5",
              "scale-[1.05]",
            );
          }, 2000);
          sessionStorage.removeItem("last_cart_item");
        });
      },
    };
  }
</script>
