<div
  x-data="{open:true}"
  class="border border-neutral rounded-2xl overflow-hidden bg-white"
>
  <button
    @click="open = !open"
    class="w-full px-5 py-4 flex justify-between items-center"
  >
    <h3 class="font-semibold text-primary">Categories</h3>

    <i
      class="bi bi-chevron-down transition"
      :class="open ? 'rotate-180' : ''"
    ></i>
  </button>

  <div x-show="open" x-transition class="px-5 pb-5">
    <div class="space-y-3 text-sm">
      <a href="{% url 'store' %}" class="block hover:bg-neutral"> All </a>
      {% for category in all_categories %}
      <a
        href="{% url 'store' %}?category={{ category.slug }}"
        class="block hover:bg-neutral {% if selected_category and selected_category.slug == category.slug %} bg-neutral text-primary font-medium {% endif %}"
      >
        {{ category.name }}
      </a>
      {% endfor %}
    </div>
  </div>
</div>
