<div
  x-data="{open:true}"
  class="border border-neutral rounded-2xl overflow-hidden bg-white"
>
  <button
    @click="open = !open"
    class="w-full px-5 py-4 flex justify-between items-center"
  >
    <h3 class="font-semibold text-primary">Sizes</h3>

    <i
      class="bi bi-chevron-down transition"
      :class="open ? 'rotate-180' : ''"
    ></i>
  </button>

  <div x-show="open" x-transition class="px-5 pb-5">
    <div class="flex flex-wrap gap-3">
      <label
        class="cursor-pointer border border-neutral rounded-lg px-4 py-2 hover:border-primary transition"
      >
        <input type="checkbox" class="hidden" />
        XS
      </label>

      <label
        class="cursor-pointer border border-neutral rounded-lg px-4 py-2 hover:border-primary transition"
      >
        <input type="checkbox" class="hidden" />
        SM
      </label>

      <label
        class="cursor-pointer border border-neutral rounded-lg px-4 py-2 hover:border-primary transition"
      >
        <input type="checkbox" class="hidden" />
        LG
      </label>

      <label
        class="cursor-pointer border border-neutral rounded-lg px-4 py-2 hover:border-primary transition"
      >
        <input type="checkbox" class="hidden" />
        XXL
      </label>
    </div>
  </div>
</div>
