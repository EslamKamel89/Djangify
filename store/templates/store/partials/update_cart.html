<div class="flex items-center gap-4 flex-1">
  <div
    class="flex items-center border border-neutral rounded-2xl overflow-hidden bg-white shadow-sm"
  >
    <form action="{% url 'update_cart_item' %}" method="POST">
      {% csrf_token %}
      <input type="hidden" name="product_id" value="{{ item.product.id }}" />
      <input type="hidden" name="quantity" value="1" />
      <input type="hidden" name="action" value="dec" />

      <button
        class="w-14 h-14 flex items-center justify-center text-muted hover:bg-neutral hover:text-primary transition"
      >
        <i class="bi bi-dash-lg"></i>
      </button>
    </form>

    <div class="w-16 h-14 flex items-center justify-center font-bold text-lg">
      {{ item.quantity }}
    </div>

    <form action="{% url 'update_cart_item' %}" method="POST">
      {% csrf_token %}
      <input type="hidden" name="product_id" value="{{ item.product.id }}" />
      <input type="hidden" name="quantity" value="1" />
      <input type="hidden" name="action" value="inc" />

      <button
        class="w-14 h-14 flex items-center justify-center text-muted hover:bg-neutral hover:text-primary transition"
      >
        <i class="bi bi-plus-lg"></i>
      </button>
    </form>
  </div>

  <div class="hidden md:flex flex-col">
    <span class="text-xs text-muted uppercase tracking-wider"> In Cart </span>

    <span class="font-semibold text-primary">
      {{ item.quantity }} item{{ item.quantity|pluralize }}
    </span>
  </div>
</div>
