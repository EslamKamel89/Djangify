<div
  x-data="{open:true}"
  class="border border-neutral rounded-2xl overflow-hidden bg-white"
>
  <button
    @click="open = !open"
    class="w-full px-5 py-4 flex justify-between items-center"
  >
    <h3 class="font-semibold text-primary">Price Range</h3>

    <i
      class="bi bi-chevron-down transition"
      :class="open ? 'rotate-180' : ''"
    ></i>
  </button>

  <div x-show="open" x-transition class="px-5 pb-5">
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="text-sm text-muted mb-1 block">Min</label>

        <select
          class="w-full border border-neutral rounded-lg px-3 py-2 focus:outline-none focus:border-primary"
        >
          <option>$0</option>
          <option>$50</option>
          <option>$100</option>
          <option>$150</option>
        </select>
      </div>

      <div>
        <label class="text-sm text-muted mb-1 block">Max</label>

        <select
          class="w-full border border-neutral rounded-lg px-3 py-2 focus:outline-none focus:border-primary"
        >
          <option>$50</option>
          <option>$100</option>
          <option>$500</option>
          <option>$1000+</option>
        </select>
      </div>
    </div>

    <button
      class="w-full bg-primary text-white py-2.5 rounded-lg hover:opacity-90 transition"
    >
      Apply Filters
    </button>
  </div>
</div>
